<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Job Application</title>
  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <h2>Job Application Form</h2>
  <form id="jobApplicationForm">
    <!-- Name Input Group -->
    <div class="form-group">
      <label for="fullName">Full Name</label>
      <div class="input-group">
        <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required>
      </div>
    </div>

    <!-- Email Input Group -->
    <div class="form-group">
      <label for="email">Email</label>
      <div class="input-group">
        <div class="input-group-prepend">
          <span class="input-group-text">@</span>
        </div>
        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
      </div>
    </div>

    <!-- Resume Upload Input Group -->
    <div class="form-group">
      <label for="resume">Upload Resume</label>
      <div class="input-group">
        <div class="custom-file">
          <input type="file" class="custom-file-input" id="resume" required>
          <label class="custom-file-label" id="resumeLabel" for="resume">Choose file</label>
        </div>
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn btn-primary">Submit Application</button>
  </form>
</div>

<!-- Success Modal -->
<div class="modal fade" id="successModal" tabindex="-1" role="dialog" aria-labelledby="successModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="successModalLabel">Success!</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        Your application has been successfully submitted.
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS and dependencies -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

<script>
  // Handle file input change
  document.getElementById('resume').addEventListener('change', function() {
    var fileName = this.files[0].name;
    document.getElementById('resumeLabel').innerHTML = fileName;
  });

  // Handle form submission
  document.getElementById('jobApplicationForm').addEventListener('submit', function(event) {
    event.preventDefault();
    // Show success modal
    $('#successModal').modal('show');
  });
</script>

</body>
</html>
