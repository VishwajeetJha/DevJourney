    <style>
        .media-rounded {
            position: relative;
            overflow: hidden;
            transition: transform 0.5s;
            aspect-ratio: 1/1;
        }

        .media-rounded:hover {
            transform: scale(1.1);
            aspect-ratio: unset; 
        }

        .media-rounded img {
            width: 100%;
            height: 100%;
			padding: 25px;
            object-fit: cover; 
            display: block;
        }

        .media-right {
            position: relative;
            overflow: hidden;
            transition: transform 0.5s;
            aspect-ratio: 1/1; 
        }

        .media-right:hover {
            transform: scale(1.1);
            aspect-ratio: unset; 
        }

        .media-right img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }
    </style>
