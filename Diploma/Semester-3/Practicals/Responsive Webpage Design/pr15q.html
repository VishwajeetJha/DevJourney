<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Calculation</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        #progress-bar {
            width: 70%;
            margin: 20px auto;
            border: 1px solid #ccc;
            border-radius: 5px;
            overflow: hidden;
        }
        #progress {
            width: 0%;
            background-color: #4CAF50;
            color: white;
            text-align: center;
            line-height: 30px;
        }
        form {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mt-5">Salary Calculation</h2>
        <div id="progress-bar" class="mb-4">
            <div id="progress" class="bg-success text-white">0%</div>
        </div>
        <form id="salary-form">
            <div class="form-group">
                <label for="basic-salary">Basic Salary:</label>
                <input type="number" class="form-control" id="basic-salary" name="basic-salary" required>
            </div>
            <div class="form-group">
                <label for="bonus">Bonus:</label>
                <input type="number" class="form-control" id="bonus" name="bonus" required>
            </div>
            <div class="form-group">
                <label for="deductions">Deductions:</label>
                <input type="number" class="form-control" id="deductions" name="deductions" required>
            </div>
            <button type="button" class="btn btn-primary" onclick="calculateProgress()">Calculate Progress</button>
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        function calculateProgress() {
            const basicSalary = parseFloat(document.getElementById('basic-salary').value) || 0;
            const bonus = parseFloat(document.getElementById('bonus').value) || 0;
            const deductions = parseFloat(document.getElementById('deductions').value) || 0;
            const totalSalary = basicSalary + bonus - deductions;
            const progress = (totalSalary / 10000) * 100;
            document.getElementById('progress').style.width = progress + '%';
            document.getElementById('progress').innerText = progress.toFixed(2) + '%';
        }
    </script>
</body>
</html>
