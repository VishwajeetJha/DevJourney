<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Update Progress Bar</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    </head>
    <body>
        <div class="container mt-5">
        <h3>Progress Bar Example</h3>
        <div class="progress">
        <div class="progress-bar progress-bar-striped bg-success" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <button id="myButton25" onclick="updateProgressBar(25)" class="btn btn-primary mt-3">Update Progress to 25%</button>
        <button onclick="resetProgressBar()" class="btn btn-danger mt-3">Reset Progress</button>
        </div>
    <script>
        function replaceButtonText(buttonId, text)
        {
            if (document.getElementById)
            {
                var button=document.getElementById(buttonId);
                if (button)
                {
                    if (button.childNodes[0])
                    {
                        button.childNodes[0].nodeValue=text;
                    }
                    else if (button.value)
                    {
                        button.value=text;
                    }
                    else
                    {
                        button.innerHTML=text;
                    }
                }
            }
        }
        let count=0;
        function updateProgressBar(progress) {
        const progressBar = document.querySelector(".progress-bar");
        progressBar.classList.add("progress-bar-animated");
        count = count + progress;
        progressBar.style.width = count + "%";
        progressBar.innerText = count + "%";
        progressBar.setAttribute("aria-valuenow", count);
        replaceButtonText('myButton25','Update Progress to ' + count + '%');
        }
        function resetProgressBar() {
        const progressBar = document.querySelector(".progress-bar");
        progressBar.classList.remove("progress-bar-animated");
        progressBar.style.width = "0%";
        progressBar.innerText = "0%";
        progressBar.setAttribute("aria-valuenow", 0);
        count=0;
        replaceButtonText('myButton25','Update Progress to ' + count + '%');
        }
    </script>
    <div class="container mt-5">
    <h3>Multicolor Progress Bar</h3>
    <div class="progress">
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 40%;" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100"></div>
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-danger" style="width: 30%;" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100"></div>
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-warning" style="width: 30%;" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100"></div>
    </div>
    </div>
</body>
</html>
