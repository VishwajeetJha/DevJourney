<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

<div class="container">
    <div class="row">
        <!-- First Column -->
        <div class="col-md-6">
            <!-- Nested Columns -->
            <div class="row">
                <div class="col-md-6">
                    <!-- Content for the first nested column -->
                    <div class="content-box">
                        <!-- Content for the first nested column -->
                        <h2>Column 1A</h2>
                        <p>Col 1A Text</p>
                    </div>
                </div>
                <div class="col-md-6">
                    <!-- Content for the second nested column -->
                    <div class="content-box">
                        <h2>Column 1B</h2>
                        <p>Col 1B Text</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Second Column -->
        <div class="col-md-6">
            <!-- Nested Columns -->
            <div class="row">
                <div class="col-md-6">
                    <!-- Content for the first nested column -->
                    <div class="content-box">
                        <h2>Column 2A</h2>
                        <p>Col 2A Text</p>
                    </div>
                </div>
                <div class="col-md-6">
                    <!-- Content for the second nested column -->
                    <div class="content-box">
                        <h2>Column 2B</h2>
                        <p>Col 2B Text</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
